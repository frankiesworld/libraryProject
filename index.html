<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Project</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="container">

        <div class="layout">
            <h1>Library Project</h1>
        </div>

        <div class="layout">
            <h1>Book Menu</h1>
            <p>This is where we will input our book form to add a book or maybe button?</p>
            <form id="bookForm">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title">

                <label for="author">Author:</label>
                <input type="text" id="author" name="author">

                <label for="pages">Pages:</label>
                <input type="number" id="pages" name="pages">

                <label for="read">Read?</label>
                <input type="checkbox" id="read" name="read">

                <button type="submit" id="btn">Add Book</button>
            </form>
        </div>

        <div class="layout">
            <h1>Archive</h1>
            <p>the list of books in our library, will be in display cards and option to mark read and delete</p>
            <div id="bookList">display</div>
        </div>
    </div>


    <script src="scripts.js"></script>
</body>
</html>
